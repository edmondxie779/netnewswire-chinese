name: Sync Upstream

# 每天自动检查上游 Ranchero-Software/NetNewsWire 更新（稳妥模式）：
# - 无冲突且无新增未翻译词条：自动合并推送到 zh-hans；若版本号变化则自动触发 Release zh-Hans。
# - 有新增未翻译词条：推送到 auto-sync/upstream 分支，并创建带 upstream-sync 标签的 Issue。
# - 有代码/工程文件冲突，或本流程自身出错：创建带 upstream-sync 标签的 Issue。
# 带 upstream-sync 标签的 Issue 会触发 OpenBot 代码管家自动修复并直接推送到 zh-hans。
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: '即使版本号未变化也触发发布'
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  sync:
    name: Check and sync upstream
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout zh-hans
        uses: actions/checkout@v5
        with:
          ref: zh-hans
          fetch-depth: 0

      - name: Prepare helpers
        run: |
          cat > /tmp/sync-helpers.sh <<'SH'
          open_issue() {
            # 已有打开的 upstream-sync 议题就追加评论，否则新建（新建才会触发 OpenBot）
            existing=$(gh issue list --state open --label upstream-sync --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file "$2"
            else
              gh issue create --title "$1" --label upstream-sync --body-file "$2"
            fi
          }
          SH

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Ranchero-Software/NetNewsWire.git
          git fetch upstream main
          ahead=$(git rev-list --count HEAD..upstream/main)
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
        id: fetch

      - name: Merge upstream and check translations
        if: steps.fetch.outputs.ahead != '0'
        id: merge
        run: |
          set -euo pipefail
          set +e
          git merge --no-commit --no-ff upstream/main
          set -e

          python3 buildscripts/merge-xcstrings.py

          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            {
              echo "自动合并 \`upstream/main\`（\`${{ steps.fetch.outputs.upstream_sha }}\`）时遇到无法自动解决的冲突，请手动处理："
              echo ""
              echo '```'
              echo "$unresolved"
              echo '```'
            } > /tmp/sync-report.md
            git merge --abort
            exit 0
          fi

          git commit -m "Merge upstream/main (${{ steps.fetch.outputs.upstream_sha }})"

          version_changed="false"
          if git diff --name-only HEAD^1 HEAD | grep -qx 'xcconfig/common/NetNewsWire_version.xcconfig'; then
            version_changed="true"
          fi
          echo "version_changed=$version_changed" >> "$GITHUB_OUTPUT"

          python3 buildscripts/find-missing-zh-hans.py > /tmp/missing.txt
          if grep -q 'untranslated' /tmp/missing.txt; then
            echo "status=missing_translations" >> "$GITHUB_OUTPUT"
            {
              echo "已自动合并 \`upstream/main\`（\`${{ steps.fetch.outputs.upstream_sha }}\`），但检测到新增未翻译的简体中文词条，请补译后合并此 PR："
              echo ""
              echo '```'
              cat /tmp/missing.txt
              echo '```'
            } > /tmp/sync-report.md
          else
            echo "status=clean" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch for missing translations
        if: steps.merge.outputs.status == 'missing_translations'
        run: git push --force origin HEAD:refs/heads/auto-sync/upstream

      - name: Open issue for conflict or missing translations
        if: steps.merge.outputs.status == 'conflict' || steps.merge.outputs.status == 'missing_translations'
        run: |
          source /tmp/sync-helpers.sh
          if [ "${{ steps.merge.outputs.status }}" = "conflict" ]; then
            title="上游同步遇到代码冲突（${{ steps.fetch.outputs.upstream_sha }}）"
          else
            title="上游同步有未翻译词条（${{ steps.fetch.outputs.upstream_sha }}）"
          fi
          open_issue "$title" /tmp/sync-report.md

      - name: Push zh-hans and trigger release
        if: steps.merge.outputs.status == 'clean' || (steps.fetch.outputs.ahead == '0' && inputs.force_release)
        run: |
          if [ "${{ steps.merge.outputs.status }}" = "clean" ]; then
            git push origin zh-hans
          fi
          if [ "${{ steps.merge.outputs.version_changed }}" = "true" ] || [ "${{ inputs.force_release }}" = "true" ]; then
            gh workflow run release-zh-hans.yml --ref zh-hans
          else
            echo "已同步上游提交，但 NetNewsWire_version.xcconfig 未变化，跳过自动发版。"
          fi

      - name: Open issue on workflow failure
        if: failure()
        run: |
          source /tmp/sync-helpers.sh
          echo "同步上游的 Actions 运行出错：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /tmp/fail.md
          open_issue "上游同步流程运行出错（run ${{ github.run_id }}）" /tmp/fail.md
